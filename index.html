<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISC Study Mate — Classes XI &amp; XII</title>
<meta name="description" content="A complete ISC (CISCE) study companion for Classes XI and XII — English, Mathematics, Physics, Chemistry and Biology. Full syllabus, chapter notes, formulas, model answers and instant search.">
<meta name="theme-color" content="#f7f7f5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="dot">📚</span>
      <span>Study Mate<small>ISC · Classes XI &amp; XII</small></span>
    </div>
    <button class="icon-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch theme">◑</button>
    <nav class="nav">
      <button data-v="home" class="on"><i>🏠</i>Home</button>
      <button data-v="course"><i>📋</i>Course</button>
      <button data-v="ask"><i>💬</i>Ask</button>
      <button data-v="revise"><i>🗂</i>Revise</button>
      <button data-v="plan"><i>🗓</i>Plan</button>
    </nav>
  </div>
</header>

<main>
  <section id="v-home"    class="view on"></section>
  <section id="v-course"  class="view"></section>
  <section id="v-chapter" class="view"></section>
  <section id="v-ask"     class="view"></section>
  <section id="v-revise"  class="view"></section>
  <section id="v-plan"    class="view"></section>
</main>

<script src="data/physics.js"></script>
<script src="data/chemistry.js"></script>
<script src="data/maths.js"></script>
<script src="data/biology.js"></script>
<script src="data/english.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
